# LMCS Agent server as a container.
#
#   docker compose up -d --build     # build locally and start
#   docker compose pull && docker compose up -d   # use the published image
#
# The image ships only the server and web client. Provider CLIs (qoder, codex,
# claude, cursor-agent, ...) are not baked in — mount their binaries and
# credential directories.
name: lmcs-agent

services:
  server:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-leandroasilva}/lmcs-agent:${LMCS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: lmcs-agent-server
    restart: unless-stopped
    init: true
    ports:
      - "${LMCS_PUBLISH_PORT:-80}:80"
    environment:
      LMCS_HOME: /data
      LMCS_HOST: 0.0.0.0
      LMCS_PORT: "80"
      LMCS_DISABLE_AUTO_UPDATE: "1"
      # ── Provider credentials (uncomment the ones you use) ──
      # Qoder PAT for authentication
      # QODER_PERSONAL_ACCESS_TOKEN: ${QODER_PERSONAL_ACCESS_TOKEN:-}
      #
      # Clerk auth for LMCS Connect (cloud tunnel)
      # LMCS_CLERK_PUBLISHABLE_KEY: ${LMCS_CLERK_PUBLISHABLE_KEY:-}
      # LMCS_RELAY_URL: ${LMCS_RELAY_URL:-}
      #
      # Dev auth token (optional, for development)
      # LMCS_DEV_AUTH_TOKEN: ${LMCS_DEV_AUTH_TOKEN:-}
    volumes:
      - lmcs-data:/data
      # ── Provider CLIs and credentials ──
      # Uncomment and adjust paths for the providers you use.
      # The container runs as user `node` (uid 1000), so mounted dirs
      # must be readable by that user.
      #
      # Qoder CLI credentials:
      # - ${HOME}/.qoder:/home/node/.qoder
      #
      # Claude credentials:
      # - ${HOME}/.claude:/home/node/.claude
      #
      # Codex credentials:
      # - ${HOME}/.codex:/home/node/.codex
      #
      # OpenCode credentials:
      # - ${HOME}/.config/opencode:/home/node/.config/opencode
      #
      # Workspace code (mount the repos you want the agent to work on):
      # - ${HOME}/code:/home/node/code
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('node:net').connect(80,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3

volumes:
  lmcs-data:
