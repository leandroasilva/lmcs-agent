<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LMCS Code - Pairing Dashboard</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell,
          sans-serif;
        background: #0a0a0a;
        color: #e5e5e5;
        min-height: 100vh;
        padding: 2rem;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      header {
        margin-bottom: 2rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid #262626;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }

      .subtitle {
        color: #a3a3a3;
        font-size: 0.875rem;
      }

      .actions {
        margin-bottom: 2rem;
      }

      button {
        background: #3b82f6;
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 0.375rem;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
      }

      button:hover {
        background: #2563eb;
      }

      button:disabled {
        background: #525252;
        cursor: not-allowed;
      }

      button.danger {
        background: #ef4444;
      }

      button.danger:hover {
        background: #dc2626;
      }

      .links-grid {
        display: grid;
        gap: 1rem;
      }

      .link-card {
        background: #171717;
        border: 1px solid #262626;
        border-radius: 0.5rem;
        padding: 1.5rem;
        transition: border-color 0.2s;
      }

      .link-card:hover {
        border-color: #404040;
      }

      .link-header {
        display: flex;
        justify-content: space-between;
        align-items: start;
        margin-bottom: 1rem;
      }

      .link-label {
        font-weight: 600;
        font-size: 1rem;
        margin-bottom: 0.25rem;
      }

      .link-meta {
        color: #a3a3a3;
        font-size: 0.75rem;
      }

      .link-url {
        background: #0a0a0a;
        border: 1px solid #262626;
        border-radius: 0.375rem;
        padding: 0.75rem;
        font-family: "Courier New", monospace;
        font-size: 0.75rem;
        word-break: break-all;
        margin-bottom: 1rem;
        color: #3b82f6;
      }

      .link-actions {
        display: flex;
        gap: 0.5rem;
      }

      .empty-state {
        text-align: center;
        padding: 3rem;
        color: #a3a3a3;
      }

      .loading {
        text-align: center;
        padding: 2rem;
        color: #a3a3a3;
      }

      .error {
        background: #7f1d1d;
        border: 1px solid #991b1b;
        color: #fecaca;
        padding: 1rem;
        border-radius: 0.375rem;
        margin-bottom: 1rem;
      }

      .success {
        background: #14532d;
        border: 1px solid #166534;
        color: #bbf7d0;
        padding: 1rem;
        border-radius: 0.375rem;
        margin-bottom: 1rem;
      }

      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.8);
        z-index: 1000;
        align-items: center;
        justify-content: center;
      }

      .modal.active {
        display: flex;
      }

      .modal-content {
        background: #171717;
        border: 1px solid #262626;
        border-radius: 0.5rem;
        padding: 2rem;
        max-width: 500px;
        width: 90%;
      }

      .modal-content h2 {
        margin-bottom: 1rem;
        font-size: 1.25rem;
      }

      .form-group {
        margin-bottom: 1rem;
      }

      label {
        display: block;
        margin-bottom: 0.5rem;
        font-size: 0.875rem;
        color: #a3a3a3;
      }

      input,
      select {
        width: 100%;
        background: #0a0a0a;
        border: 1px solid #262626;
        border-radius: 0.375rem;
        padding: 0.75rem;
        color: #e5e5e5;
        font-size: 0.875rem;
      }

      input:focus,
      select:focus {
        outline: none;
        border-color: #3b82f6;
      }

      .modal-actions {
        display: flex;
        gap: 0.5rem;
        justify-content: flex-end;
        margin-top: 1.5rem;
      }

      button.secondary {
        background: #404040;
      }

      button.secondary:hover {
        background: #525252;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <header>
        <h1>🔗 Pairing Dashboard</h1>
        <p class="subtitle">Gerencie os pairing links do seu servidor LMCS Code</p>
      </header>

      <div class="actions">
        <button onclick="openCreateModal()">+ Criar Novo Pairing Link</button>
      </div>

      <div id="message"></div>

      <div id="linksContainer">
        <div class="loading">Carregando...</div>
      </div>
    </div>

    <!-- Modal de Criação -->
    <div id="createModal" class="modal">
      <div class="modal-content">
        <h2>Criar Novo Pairing Link</h2>
        <form id="createForm">
          <div class="form-group">
            <label for="label">Label (opcional)</label>
            <input type="text" id="label" placeholder="Ex: Meu MacBook Pro" />
          </div>
          <div class="form-group">
            <label for="ttl">Validade</label>
            <select id="ttl">
              <option value="5m">5 minutos</option>
              <option value="15m">15 minutos</option>
              <option value="1h" selected>1 hora</option>
              <option value="24h">24 horas</option>
              <option value="7d">7 dias</option>
            </select>
          </div>
          <div class="modal-actions">
            <button type="button" class="secondary" onclick="closeCreateModal()">Cancelar</button>
            <button type="submit">Criar</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const API_BASE = window.location.origin;

      async function loadLinks() {
        try {
          const response = await fetch(`${API_BASE}/api/pairing-dashboard/list`);
          const data = await response.json();

          if (data.links.length === 0) {
            document.getElementById("linksContainer").innerHTML = `
            <div class="empty-state">
              <p>Nenhum pairing link ativo</p>
              <p style="font-size: 0.75rem; margin-top: 0.5rem;">Clique em "Criar Novo Pairing Link" para começar</p>
            </div>
          `;
            return;
          }

          const html = data.links
            .map(
              (link) => `
          <div class="link-card">
            <div class="link-header">
              <div>
                <div class="link-label">${link.label}</div>
                <div class="link-meta">
                  Criado: ${new Date(link.createdAt).toLocaleString("pt-BR")} • 
                  Expira: ${new Date(link.expiresAt).toLocaleString("pt-BR")}
                </div>
              </div>
            </div>
            <div class="link-url">${link.pairingUrl}</div>
            <div class="link-actions">
              <button onclick="copyLink('${link.pairingUrl}')"> Copiar</button>
              <button class="danger" onclick="revokeLink('${link.id}', '${link.label}')">Revogar</button>
            </div>
          </div>
        `,
            )
            .join("");

          document.getElementById("linksContainer").innerHTML =
            `<div class="links-grid">${html}</div>`;
        } catch (error) {
          document.getElementById("linksContainer").innerHTML = `
          <div class="error">Erro ao carregar links: ${error.message}</div>
        `;
        }
      }

      function openCreateModal() {
        document.getElementById("createModal").classList.add("active");
      }

      function closeCreateModal() {
        document.getElementById("createModal").classList.remove("active");
        document.getElementById("createForm").reset();
      }

      document.getElementById("createForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const label = document.getElementById("label").value;
        const ttl = document.getElementById("ttl").value;

        try {
          const response = await fetch(`${API_BASE}/api/pairing-dashboard/create`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ label, ttl }),
          });

          const data = await response.json();

          showMessage("success", `Pairing link criado com sucesso!`);
          closeCreateModal();
          loadLinks();
        } catch (error) {
          showMessage("error", `Erro ao criar link: ${error.message}`);
        }
      });

      async function revokeLink(id, label) {
        if (!confirm(`Tem certeza que deseja revogar o link "${label}"?`)) {
          return;
        }

        try {
          await fetch(`${API_BASE}/api/pairing-dashboard/revoke`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id }),
          });

          showMessage("success", "Link revogado com sucesso!");
          loadLinks();
        } catch (error) {
          showMessage("error", `Erro ao revogar link: ${error.message}`);
        }
      }

      function copyLink(url) {
        navigator.clipboard.writeText(url).then(() => {
          showMessage("success", "Link copiado para a área de transferência!");
        });
      }

      function showMessage(type, message) {
        const messageDiv = document.getElementById("message");
        messageDiv.innerHTML = `<div class="${type}">${message}</div>`;
        setTimeout(() => {
          messageDiv.innerHTML = "";
        }, 5000);
      }

      // Carregar links ao iniciar
      loadLinks();

      // Atualizar a cada 30 segundos
      setInterval(loadLinks, 30000);
    </script>
  </body>
</html>
