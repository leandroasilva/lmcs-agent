name: Deploy Marketing Site

on:
  push:
    branches:
      - main
    paths:
      - "apps/marketing/**"
  workflow_dispatch:

concurrency:
  group: deploy-marketing-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy Marketing Site
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install pnpm
        run: npm install -g pnpm@11.10.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build marketing site
        run: pnpm --filter @lmcstools/marketing build

      - name: Deploy via SFTP
        run: |
          # Install lftp for SFTP deployment
          sudo apt-get update && sudo apt-get install -y lftp
                
          # Deploy using lftp
          lftp -c "
            set sftp:auto-confirm yes;
            open sftp://${{ secrets.MARKETING_SFTP_USER }}:${{ secrets.MARKETING_SFTP_PASSWORD }}@${{ secrets.MARKETING_SFTP_HOST }}:${{ secrets.MARKETING_SFTP_PORT }};
            mkdir -p code.lmcs.tec.br;
            mirror -R --delete ./apps/marketing/dist/ code.lmcs.tec.br/;
            bye;
          "
