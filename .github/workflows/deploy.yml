name: Deploy

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  HCLOUD_URL: https://hcloud.net.br
  HOSTED_APP_URL: https://lmcs-agent.cloud.hcloud.net.br

jobs:
  # ─── Version ────────────────────────────────────────────────────────
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: resolve
        name: Resolve semantic version
        shell: bash
        run: |
          set -euo pipefail

          # Find the latest semantic version tag (vX.Y.Z pattern)
          # Ignore non-semver tags like date-based tags (v20261006.c42d90c)
          latest_semver_tag=""
          for tag in $(git tag --list --sort=-v:refname); do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest_semver_tag="$tag"
              break
            fi
          done

          # If no semver tag found, start from 0.0.0
          if [[ -z "$latest_semver_tag" ]]; then
            latest_version="0.0.0"
          else
            latest_version=${latest_semver_tag#v}
          fi

          # Parse version components
          IFS='.' read -r major minor patch <<< "$latest_version"

          # Determine version bump based on PR labels or default to patch
          bump_type="patch"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            pr_labels=$(gh pr view ${{ github.event.pull_request.number }} --json labels --jq '.labels[].name' 2>/dev/null || echo "")
            if echo "$pr_labels" | grep -q "breaking"; then
              bump_type="major"
            elif echo "$pr_labels" | grep -q "feature"; then
              bump_type="minor"
            fi
          fi

          # Bump version
          case $bump_type in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          new_version="${major}.${minor}.${patch}"
          new_tag="v${new_version}"

          echo "Bump type: $bump_type"
          echo "Previous version: $latest_version"
          echo "New version: $new_version"

          echo "version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "tag=${new_tag}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Server (Docker) ──────────────────────────────────────────────
  server:
    name: Build & push server image
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Docker metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/lmcs-agent
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ needs.version.outputs.version }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HOSTED_APP_URL=${{ env.HOSTED_APP_URL }}

  # ─── Deploy to HCloud ──────────────────────────────────────────────
  deploy:
    name: Deploy to HCloud
    needs: [version, server]
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check hcloud configuration
        id: check
        shell: bash
        env:
          HCLOUD_APP_ID: ${{ secrets.HCLOUD_APP_ID }}
          HCLOUD_APP_TOKEN: ${{ secrets.HCLOUD_APP_TOKEN }}
        run: |
          if [[ -n "$HCLOUD_APP_ID" && -n "$HCLOUD_APP_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping HCloud deployment: HCLOUD_APP_ID and/or HCLOUD_APP_TOKEN secrets are not configured."
          fi

      - name: Notify HCloud (image-webhook)
        if: steps.check.outputs.enabled == 'true'
        shell: bash
        env:
          HCLOUD_APP_ID: ${{ secrets.HCLOUD_APP_ID }}
          HCLOUD_APP_TOKEN: ${{ secrets.HCLOUD_APP_TOKEN }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/lmcs-agent:${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -s -o resposta.json -w "%{http_code}" \
            -X POST "$HCLOUD_URL/api/cloud/apps/$HCLOUD_APP_ID/image-webhook" \
            -H "Authorization: Bearer $HCLOUD_APP_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"image\":\"$IMAGE\"}")
          echo "HTTP $HTTP_CODE — resposta da HCloud:"
          cat resposta.json; echo
          if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
            echo "::error::HCloud webhook failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "::notice::Deployed $IMAGE to HCloud (app $HCLOUD_APP_ID)"

  # ─── Desktop: macOS ────────────────────────────────────────────────
  desktop_macos:
    name: Desktop macOS
    needs: version
    if: github.event.pull_request.merged == true
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install pnpm
        run: npm install -g pnpm@11.10.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web client
        run: VITE_HOSTED_APP_URL="${{ env.HOSTED_APP_URL }}" pnpm --filter @lmcstools/web run build

      - name: Build server bundle
        run: pnpm --filter lmcs-agent run build

      - name: Package macOS app
        working-directory: apps/desktop
        run: DEBUG=electron-builder,electron-updater npx electron-builder --mac --arm64 --x64 --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing (optional - if not set, app will be ad-hoc signed)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: List generated artifacts
        if: always()
        working-directory: apps/desktop
        run: |
          echo "=== Files in dist/ ==="
          ls -lh dist/ 2>/dev/null || echo "dist/ directory not found"
          echo ""
          echo "=== DMG files ==="
          ls -lh dist/*.dmg 2>/dev/null || echo "No DMG files found"
          echo ""
          echo "=== ZIP files ==="
          ls -lh dist/*.zip 2>/dev/null || echo "No ZIP files found"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v5
        with:
          name: desktop-macos
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
          if-no-files-found: warn
          retention-days: 30

  # ─── Desktop: Linux ────────────────────────────────────────────────
  # DISABLED: electron-builder OOM during node_modules scan on Linux runner
  # Requires manual investigation on a local Linux runner
  desktop_linux_disabled:
    name: Desktop Linux (DISABLED)
    needs: version
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - run: echo "Linux build disabled - requires manual investigation"

  # ─── Desktop: Windows ──────────────────────────────────────────────
  # DISABLED: electron-builder OOM during node_modules scan on Windows runner
  # Requires manual investigation on a local Windows runner
  desktop_windows_disabled:
    name: Desktop Windows (DISABLED)
    needs: version
    if: false
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - run: echo "Windows build disabled - requires manual investigation"

  # ── Tag release ───────────────────────────────────────────────────
  tag:
    name: Create version tag
    needs: [version, deploy, desktop_macos]
    if: github.event.pull_request.merged == true && always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create version tag
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::notice::Tag $TAG already exists, skipping."
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "::notice::Created tag $TAG"
          fi

  # ── GitHub Release (fallback) ─────────────────────────────────────
  # Creates release if electron-builder didn't publish automatically
  release:
    name: Create GitHub Release
    needs: [version, tag, desktop_macos]
    if: github.event.pull_request.merged == true && always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check if macOS build succeeded
        id: check_artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if desktop_macos job succeeded
          if [[ "${{ needs.desktop_macos.result }}" == "success" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "::notice::macOS build succeeded, will download artifacts"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::macOS build did not succeed (result: ${{ needs.desktop_macos.result }}), skipping artifact download"
          fi

      - name: Download macOS artifacts
        if: steps.check_artifact.outputs.available == 'true'
        uses: actions/download-artifact@v5
        with:
          name: desktop-macos
          path: artifacts/

      - name: Check if release exists
        id: check_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$TAG" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $TAG already exists (created by electron-builder)"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $TAG does not exist, will create it"
          fi

      - name: Create release and upload artifacts
        if: steps.check_release.outputs.exists == 'false' && steps.check_artifact.outputs.available == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          # List available artifacts
          echo "=== Available artifacts ==="
          ls -lh artifacts/

          # Create release
          gh release create "$TAG" \
            --title "v$VERSION" \
            --notes "Release v$VERSION" \
            --generate-notes \
            artifacts/*.{dmg,zip} 2>/dev/null || \
          gh release create "$TAG" \
            --title "v$VERSION" \
            --notes "Release v$VERSION" \
            --generate-notes \
            artifacts/*

          echo "::notice::Created release $TAG with artifacts"

      - name: Create release without artifacts
        if: steps.check_release.outputs.exists == 'false' && steps.check_artifact.outputs.available == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            --title "v$VERSION" \
            --notes "Release v$VERSION (server-only, no desktop artifacts)" \
            --generate-notes

          echo "::notice::Created release $TAG without desktop artifacts"
