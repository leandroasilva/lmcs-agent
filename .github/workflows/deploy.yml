name: Deploy

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
      - "!v*-nightly.*"
      - "!v*-preview.*"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  HCLOUD_URL: https://hcloud.net.br
  HOSTED_APP_URL: https://lmcs-agent.cloud.hcloud.net.br

jobs:
  # ─── Version ────────────────────────────────────────────────────────
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            date_part=$(date -u +%Y%m%d)
            sha_part="${GITHUB_SHA::7}"
            echo "version=0.0.0-${date_part}.${sha_part}" >> "$GITHUB_OUTPUT"
            echo "tag=v${date_part}.${sha_part}" >> "$GITHUB_OUTPUT"
          fi

  # ─── Server (Docker) ──────────────────────────────────────────────
  server:
    name: Build & push server image
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Docker metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/lmcs-agent
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ needs.version.outputs.version }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            HOSTED_APP_URL=${{ env.HOSTED_APP_URL }}

  # ─── Deploy to HCloud ──────────────────────────────────────────────
  deploy:
    name: Deploy to HCloud
    needs: [version, server]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check hcloud configuration
        id: check
        shell: bash
        env:
          HCLOUD_APP_ID: ${{ secrets.HCLOUD_APP_ID }}
          HCLOUD_APP_TOKEN: ${{ secrets.HCLOUD_APP_TOKEN }}
        run: |
          if [[ -n "$HCLOUD_APP_ID" && -n "$HCLOUD_APP_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping HCloud deployment: HCLOUD_APP_ID and/or HCLOUD_APP_TOKEN secrets are not configured."
          fi

      - name: Notify HCloud (image-webhook)
        if: steps.check.outputs.enabled == 'true'
        shell: bash
        env:
          HCLOUD_APP_ID: ${{ secrets.HCLOUD_APP_ID }}
          HCLOUD_APP_TOKEN: ${{ secrets.HCLOUD_APP_TOKEN }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/lmcs-agent:${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -s -o resposta.json -w "%{http_code}" \
            -X POST "$HCLOUD_URL/api/cloud/apps/$HCLOUD_APP_ID/image-webhook" \
            -H "Authorization: Bearer $HCLOUD_APP_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"image\":\"$IMAGE\"}")
          echo "HTTP $HTTP_CODE — resposta da HCloud:"
          cat resposta.json; echo
          if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
            echo "::error::HCloud webhook failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "::notice::Deployed $IMAGE to HCloud (app $HCLOUD_APP_ID)"

  # ── Desktop: macOS ────────────────────────────────────────────────
  desktop_macos:
    name: Desktop macOS
    needs: version
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Enable corepack
        run: corepack enable && corepack prepare pnpm@11.10.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter=lmcs... --filter=@lmcstools/web... --filter=@lmcstools/desktop... --filter=@lmcstools/scripts...

      - name: Set version
        run: node scripts/update-release-package-versions.ts "${{ needs.version.outputs.version }}"

      - name: Build web client
        run: VITE_HOSTED_APP_URL="${{ env.HOSTED_APP_URL }}" pnpm --filter @lmcstools/web run build

      - name: Build server bundle
        run: pnpm --filter lmcs-agent run build

      - name: Package macOS app
        working-directory: apps/desktop
        run: npx electron-builder --mac --arm64 --x64 --publish=never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
          if-no-files-found: warn
          retention-days: 30

  # ─── Desktop: Linux ────────────────────────────────────────────────
  desktop_linux:
    name: Desktop Linux
    needs: version
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Enable corepack
        run: corepack enable && corepack prepare pnpm@11.10.0 --activate

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter=lmcs... --filter=@lmcstools/web... --filter=@lmcstools/desktop... --filter=@lmcstools/scripts...

      - name: Set version
        run: node scripts/update-release-package-versions.ts "${{ needs.version.outputs.version }}"

      - name: Build web client
        run: VITE_HOSTED_APP_URL="${{ env.HOSTED_APP_URL }}" pnpm --filter @lmcstools/web run build

      - name: Build server bundle
        run: pnpm --filter lmcs-agent run build

      - name: Package Linux app
        working-directory: apps/desktop
        run: npx electron-builder --linux --x64 --arm64 --publish=never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.rpm
          if-no-files-found: warn
          retention-days: 30

  # ─── Desktop: Windows ──────────────────────────────────────────────
  desktop_windows:
    name: Desktop Windows
    needs: version
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Enable corepack
        shell: bash
        run: corepack enable && corepack prepare pnpm@11.10.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter=lmcs... --filter=@lmcstools/web... --filter=@lmcstools/desktop... --filter=@lmcstools/scripts...

      - name: Set version
        shell: bash
        run: node scripts/update-release-package-versions.ts "${{ needs.version.outputs.version }}"

      - name: Build web client
        shell: bash
        run: VITE_HOSTED_APP_URL="${{ env.HOSTED_APP_URL }}" pnpm --filter @lmcstools/web run build

      - name: Build server bundle
        run: pnpm --filter lmcs-agent run build

      - name: Package Windows app
        working-directory: apps/desktop
        run: npx electron-builder --win --x64 --arm64 --publish=never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.msi
            apps/desktop/dist/*.zip
          if-no-files-found: warn
          retention-days: 30

  # ── Tag release ───────────────────────────────────────────────────
  tag:
    name: Create version tag
    needs: [version, deploy, desktop_macos, desktop_linux, desktop_windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create version tag
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::notice::Tag $TAG already exists, skipping."
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "::notice::Created tag $TAG"
          fi

  # ── GitHub Release ────────────────────────────────────────────────
  release:
    name: Create GitHub release
    needs: [version, tag, desktop_macos, desktop_linux, desktop_windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: LMCS Agent v${{ needs.version.outputs.version }}
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/desktop-macos/**/*
            artifacts/desktop-linux/**/*
            artifacts/desktop-windows/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
