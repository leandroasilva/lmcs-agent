[package]
name = "lmcs-pty"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
portable-pty = "0.9.0"
lmcs-terminal-history = { path = "../terminal-history" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
