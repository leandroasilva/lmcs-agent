[package]
name = "lmcs-contracts"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"

# Only the golden replay declares a concrete `isPattern` rule so far; the 28 real sites
# move this to `[dependencies]` when they are ported.
[dev-dependencies]
regex = "1.13.1"
